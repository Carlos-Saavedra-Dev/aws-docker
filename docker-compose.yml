services:
  db:
    image: mysql:8.0
    container_name: fastapi-mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecretpassword}
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 35s

  api:
    build: ./api
    container_name: fastapi_api
    restart: always
    environment:
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: appdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx_server
    restart: always
    environment:
      API_HOST: api        # en compose el API se resuelve por nombre de servicio
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - internal-net

volumes:
  mysql_data:

networks:
  internal-net:
    driver: bridge
